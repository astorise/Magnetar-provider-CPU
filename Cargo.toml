[workspace]

[package]
name = "magnetar-provider-cpu"
version = "1.0.0-RC0"
edition = "2024"
license = "MIT"
description = "Reference CPU Provider for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-provider-CPU"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science", "hardware-support"]
rust-version = "1.98"

[dependencies]
# `path` resolves inside a checkout of the parent Magnetar repository;
# `version` is what `cargo publish` records for crates.io consumers.
magnetar-runtime = { version = "1.0.0-RC0", path = "../../magnetar-runtime" }
